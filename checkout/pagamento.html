<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="content-security-policy" content="default-src 'none'; connect-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>Pagamento via Pix</title>
<style>
  :root{
    --bg:#01191e;
    --card:#03282f;
    --card-2:#0d3840;
    --border:#20515f;
    --green:#00ff7a;
    --text:#f4fffb;
    --muted:#8fb5ad;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:20px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  header a{
    color:var(--green);
    font-weight:800;
    font-size:18px;
    text-decoration:none;
    letter-spacing:.02em;
  }
  main{
    flex:1;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .wrap{
    width:100%;
    max-width:460px;
  }
  h1{
    font-size:20px;
    font-weight:800;
    text-align:center;
    margin:0 0 4px;
  }
  .subtitle{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin:0 0 24px;
  }
  .order-card{
    background:var(--card);
    border:1px solid var(--border);
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
  }
  .order-card .nome{
    font-size:14px;
    font-weight:700;
    line-height:1.3;
  }
  .order-card .preco{
    font-size:16px;
    font-weight:800;
    color:var(--green);
    white-space:nowrap;
  }
  .pix-card{
    background:var(--card);
    border:1px solid var(--border);
    padding:24px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .pix-card p.label{
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--green);
    margin:0;
    text-align:center;
  }
  .qr-box{
    background:#fff;
    padding:12px;
    border-radius:8px;
    width:200px;
    height:200px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .qr-box img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .code-box{
    width:100%;
    resize:none;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    font-size:11px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding:10px;
    border-radius:8px;
    word-break:break-all;
  }
  .copy-btn{
    width:100%;
    height:52px;
    border:none;
    border-radius:12px;
    background:var(--green);
    color:#fff;
    font-weight:800;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:.03em;
    cursor:pointer;
  }
  .copy-btn:hover{ filter:brightness(1.08) }
  .status-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:13px;
    color:var(--muted);
  }
  .spinner{
    width:14px;
    height:14px;
    border-radius:999px;
    border:2px solid var(--border);
    border-top-color:var(--green);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .success-box{
    width:100%;
    background:rgba(0,255,122,.14);
    border:1px solid var(--green);
    color:var(--text);
    border-radius:10px;
    padding:16px;
    text-align:center;
    font-weight:700;
    font-size:14px;
  }
  .error-box{
    width:100%;
    background:#3a1414;
    border:1px solid #7a2323;
    color:#ffb4b4;
    border-radius:10px;
    padding:16px;
    text-align:center;
    font-weight:700;
    font-size:14px;
  }
  .back-link{
    display:block;
    text-align:center;
    margin-top:20px;
    color:var(--muted);
    font-size:13px;
    text-decoration:underline;
  }
  .empty-state{
    background:var(--card);
    border:1px solid var(--border);
    padding:32px 20px;
    text-align:center;
  }
  .empty-state a{
    color:var(--green);
    font-weight:700;
  }
</style>
</head>
<body>
<header>
  <a href="../index.html">hyper games</a>
</header>
<main>
  <div class="wrap" id="app">
    <div class="empty-state">
      <p>Carregando...</p>
    </div>
  </div>
</main>
<script>(function(){
  function parseBRL(str){
    if(!str) return 0;
    var n = str.replace(/[^0-9,.-]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',', '.');
    var v = parseFloat(n);
    return Number.isFinite(v) ? v : 0;
  }
  function formatBRL(n){
    return 'R$ ' + n.toFixed(2).replace('.', ',');
  }

  function getPagamento(){
    try { return JSON.parse(sessionStorage.getItem('pixPagamento') || 'null'); }
    catch(e){ return null; }
  }

  function renderEmpty(app){
    app.innerHTML = '<div class="empty-state"><p>Nenhum pagamento em andamento.</p><p><a href="../index.html">Voltar para a loja</a></p></div>';
  }

  function render(app, pagamento){
    var pix = pagamento.pix || {};
    var valor = pagamento.preco ? formatBRL(parseBRL(pagamento.preco)) : '';

    var html = '';
    html += '<h1>Pagamento via Pix</h1>';
    html += '<p class="subtitle">Escaneie o QR Code ou copie o codigo abaixo</p>';
    html += '<div class="order-card">';
    html += '<span class="nome">' + (pagamento.produtoNome ? escapeHtml(pagamento.produtoNome) : 'Produto') + '</span>';
    html += '<span class="preco">' + valor + '</span>';
    html += '</div>';
    html += '<div class="pix-card">';
    if(pix.qrImage){
      html += '<div class="qr-box"><img src="' + pix.qrImage + '" alt="QR Code Pix"></div>';
    }
    html += '<textarea class="code-box" id="pixCode" readonly rows="3">' + (pix.code || '') + '</textarea>';
    html += '<button type="button" class="copy-btn" id="copyBtn">Copiar codigo Pix</button>';
    html += '<div class="status-row" id="statusRow"><span class="spinner"></span><span id="statusText">Aguardando confirmacao do pagamento...</span></div>';
    html += '</div>';
    html += '<a class="back-link" href="../index.html">Cancelar e voltar para a loja</a>';

    app.innerHTML = html;

    var copyBtn = document.getElementById('copyBtn');
    copyBtn.addEventListener('click', function(){
      var code = pix.code || '';
      if(navigator.clipboard){ navigator.clipboard.writeText(code); }
      copyBtn.textContent = 'Codigo copiado!';
      setTimeout(function(){ copyBtn.textContent = 'Copiar codigo Pix'; }, 2000);
    });

    if(pagamento.transactionId){
      pollStatus(pagamento.transactionId);
    }
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function setStatusBox(html){
    var pixCard = document.querySelector('.pix-card');
    var statusRow = document.getElementById('statusRow');
    if(statusRow) statusRow.outerHTML = html;
    else if(pixCard) pixCard.insertAdjacentHTML('beforeend', html);
  }

  function pollStatus(transactionId){
    var stopped = false;
    var attempts = 0;
    var MAX_ATTEMPTS = 60;
    function tick(){
      if(stopped) return;
      attempts++;
      fetch('/api/checkout/status?transactionId=' + encodeURIComponent(transactionId))
        .then(function(r){ return r.json(); })
        .then(function(data){
          if(stopped) return;
          if(data.status === 'COMPLETED' || data.status === 'OK'){
            stopped = true;
            setStatusBox('<div class="success-box">Pagamento confirmado! Seu produto ja esta sendo entregue.</div>');
            return;
          }
          if(data.status === 'FAILED' || data.status === 'CANCELED' || data.status === 'REJECTED' || data.status === 'REFUNDED' || data.status === 'CHARGED_BACK'){
            stopped = true;
            setStatusBox('<div class="error-box">Pagamento nao concluido (' + data.status + '). Volte a loja e tente novamente.</div>');
            return;
          }
          if(attempts >= MAX_ATTEMPTS){
            stopped = true;
            setStatusBox('<div class="status-row"><span id="statusText">Ainda aguardando confirmacao. Se voce ja pagou, isso pode levar mais alguns instantes.</span></div>');
            return;
          }
          setTimeout(tick, 5000);
        })
        .catch(function(){
          if(attempts >= MAX_ATTEMPTS){ stopped = true; return; }
          setTimeout(tick, 5000);
        });
    }
    setTimeout(tick, 5000);
  }

  function init(){
    var app = document.getElementById('app');
    var pagamento = getPagamento();
    if(!pagamento || !pagamento.pix){
      renderEmpty(app);
      return;
    }
    render(app, pagamento);
  }

  document.addEventListener('DOMContentLoaded', init);
  if(document.readyState !== 'loading'){ init(); }
})();</script>
</body>
</html>
